[project]
name = "depthpro2-onnx"
version = "0.1.0"
description = "Focal-free ONNX, TensorRT and ROS 2 packaging for Depth Pro 2"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "onnx==1.19.1",
    "onnxruntime-gpu==1.23.2; sys_platform == 'linux'",
    "huggingface-hub>=1.0",
    "pillow>=11.3",
]

[project.optional-dependencies]
export = [
    "depth_pro_2",
    "torch==2.8.0",
    "onnxscript>=0.5",
    "onnxslim>=0.1.70",
    "onnxconverter-common>=1.16",
    "av>=14.1",
]

[dependency-groups]
dev = ["pytest>=8"]
bench = ["nvidia-ml-py>=13", "tensorrt-cu12==10.13.3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["depthpro2_onnx"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
depth_pro_2 = { git = "https://github.com/apple-aiml-research/ml-depth-pro-2", rev = "aa389cb" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
